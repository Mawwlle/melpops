# Локальный Postgres для лабы: поднят на 5433, чтобы не конфликтовать
# с тем, что уже крутится на 5432 на машине студента.
# Внутри compose-сети приложение ходит на сервис `postgres:5432` (стандартный порт контейнера).
services:
  postgres:
    image: postgres:16-alpine
    container_name: melpops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: melpops
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d melpops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - melpops-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melpops-app
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/melpops"
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - melpops-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  melpops-network:
    driver: bridge
