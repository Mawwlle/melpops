[project]
name = "melpops"
version = "0.1.0"
description = "Лабораторный проект: FastAPI с нуля до продакшн-настроек"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "BLE", # flake8-blind-except: запрещает except Exception без уважительной причины
    "ANN", # flake8-annotations
]
ignore = [
    "RUF001", # кириллические строки — ложные срабатывания
    "RUF002", # кириллические docstring — ложные срабатывания
    "RUF003", # кириллические комментарии — ложные срабатывания
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # аннотации в тестах не несут контракта

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
